<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Handshake Enterprise Copilot — Possibility</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0b0f14; }
    #root { min-height: 100vh; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    const styles = `
      .hc-root {
        --bg: #0b0f14;
        --surface: #141a22;
        --surface-hover: #1c2430;
        --border: #2a3140;
        --text: #e2e8f0;
        --text-muted: #8191a6;
        --accent: #5b9cf5;
        --accent-hover: #7db4ff;
        --green: #3fb950;
        --yellow: #d4a017;
        --red: #f04e4e;
        --glow: #5b9cf5;
        font-family: 'Segoe UI', system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        padding: 0;
        margin: 0;
      }
      .hc-header {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 18px 32px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .hc-logo {
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--accent);
        letter-spacing: 0.02em;
      }
      .hc-logo span {
        color: var(--text-muted);
        font-weight: 400;
      }
      .hc-back-link {
        color: var(--accent);
        background: var(--bg);
        border: 1px solid var(--border);
        padding: 6px 14px;
        border-radius: 6px;
        font-size: 0.82rem;
        text-decoration: none;
        cursor: pointer;
      }
      .hc-main {
        max-width: 860px;
        margin: 0 auto;
        padding: 40px 24px 80px;
      }
      .hc-landing {
        text-align: center;
        padding: 60px 0 40px;
      }
      .hc-landing-badge {
        display: inline-block;
        background: rgba(91,156,245,0.12);
        border: 1px solid rgba(91,156,245,0.3);
        color: var(--accent);
        padding: 5px 14px;
        border-radius: 20px;
        font-size: 0.78rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        margin-bottom: 24px;
      }
      .hc-landing h1 {
        font-size: 2.2rem;
        font-weight: 700;
        margin: 0 0 16px;
        line-height: 1.25;
      }
      .hc-landing h1 em {
        font-style: normal;
        color: var(--accent);
      }
      .hc-landing-sub {
        font-size: 1.05rem;
        color: var(--text-muted);
        max-width: 560px;
        margin: 0 auto 40px;
        line-height: 1.6;
      }
      .hc-formula {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 20px 28px;
        display: inline-block;
        text-align: left;
        margin-bottom: 40px;
        font-size: 0.88rem;
      }
      .hc-formula-label {
        color: var(--text-muted);
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 8px;
      }
      .hc-formula code {
        color: var(--green);
        font-family: 'Fira Mono', 'Consolas', monospace;
        font-size: 0.92rem;
        display: block;
        line-height: 1.8;
      }
      .hc-cta-row {
        display: flex;
        gap: 14px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .hc-btn {
        padding: 11px 26px;
        border-radius: 8px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        border: none;
        transition: background 0.15s;
      }
      .hc-btn-primary {
        background: var(--accent);
        color: #fff;
      }
      .hc-btn-primary:hover { background: var(--accent-hover); }
      .hc-btn-secondary {
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--border);
      }
      .hc-btn-secondary:hover { background: var(--surface-hover); }
      .hc-btn-sm {
        padding: 7px 16px;
        font-size: 0.82rem;
      }
      .hc-step-bar {
        display: flex;
        align-items: center;
        gap: 0;
        margin-bottom: 36px;
      }
      .hc-step {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.8rem;
        color: var(--text-muted);
      }
      .hc-step.active { color: var(--accent); }
      .hc-step.done { color: var(--green); }
      .hc-step-dot {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: var(--surface);
        border: 2px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.72rem;
        font-weight: 700;
        flex-shrink: 0;
      }
      .hc-step.active .hc-step-dot {
        background: rgba(91,156,245,0.15);
        border-color: var(--accent);
        color: var(--accent);
      }
      .hc-step.done .hc-step-dot {
        background: rgba(63,185,80,0.15);
        border-color: var(--green);
        color: var(--green);
      }
      .hc-step-line {
        flex: 1;
        height: 1px;
        background: var(--border);
        margin: 0 6px;
      }
    `;

    const sliderStyles = `
      .hc-form-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 32px;
        margin-bottom: 24px;
      }
      .hc-form-title {
        font-size: 1.15rem;
        font-weight: 700;
        margin: 0 0 6px;
      }
      .hc-form-desc {
        color: var(--text-muted);
        font-size: 0.88rem;
        margin: 0 0 28px;
        line-height: 1.5;
      }
      .hc-slider-row {
        margin-bottom: 22px;
      }
      .hc-slider-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 6px;
      }
      .hc-slider-label {
        font-size: 0.9rem;
        font-weight: 600;
      }
      .hc-slider-value {
        font-size: 0.85rem;
        font-weight: 700;
        color: var(--accent);
        min-width: 32px;
        text-align: right;
      }
      .hc-slider-hint {
        font-size: 0.75rem;
        color: var(--text-muted);
        margin-bottom: 6px;
      }
      input[type=range].hc-slider {
        width: 100%;
        accent-color: var(--accent);
        height: 4px;
        cursor: pointer;
      }
      .hc-slider-ends {
        display: flex;
        justify-content: space-between;
        font-size: 0.7rem;
        color: var(--text-muted);
        margin-top: 3px;
      }
      .hc-form-nav {
        display: flex;
        justify-content: space-between;
        margin-top: 28px;
      }
    `;

    const resultsStyles = `
      .hc-results-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-bottom: 20px;
      }
      @media (max-width: 600px) { .hc-results-grid { grid-template-columns: 1fr; } }
      .hc-score-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 20px;
      }
      .hc-score-label {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-muted);
        margin-bottom: 8px;
      }
      .hc-score-big {
        font-size: 2.4rem;
        font-weight: 800;
        line-height: 1;
        margin-bottom: 6px;
      }
      .hc-score-sub {
        font-size: 0.78rem;
        color: var(--text-muted);
      }
      .hc-gauge-bar {
        height: 8px;
        background: var(--border);
        border-radius: 4px;
        overflow: hidden;
        margin: 10px 0 4px;
      }
      .hc-gauge-fill {
        height: 100%;
        border-radius: 4px;
        transition: width 0.4s ease;
      }
      .hc-verdict {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 20px 24px;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .hc-verdict-icon {
        font-size: 2rem;
        flex-shrink: 0;
      }
      .hc-verdict-title {
        font-size: 1.05rem;
        font-weight: 700;
        margin-bottom: 4px;
      }
      .hc-verdict-desc {
        font-size: 0.85rem;
        color: var(--text-muted);
        line-height: 1.5;
      }
      .hc-factors-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-bottom: 20px;
      }
      @media (max-width: 600px) { .hc-factors-grid { grid-template-columns: 1fr; } }
      .hc-factors-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 18px 20px;
      }
      .hc-factors-title {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 12px;
      }
      .hc-factor-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 9px;
        font-size: 0.85rem;
      }
      .hc-factor-dot {
        width: 8px; height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
      }
    `;

    const prStyles = `
      .hc-pr-panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 22px 24px;
        margin-bottom: 20px;
      }
      .hc-pr-header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 18px;
      }
      .hc-pr-title {
        font-size: 1rem;
        font-weight: 700;
      }
      .hc-pr-badge {
        padding: 3px 10px;
        border-radius: 12px;
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .hc-pr-item {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 14px 16px;
        margin-bottom: 10px;
        background: var(--bg);
      }
      .hc-pr-item-header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 6px;
      }
      .hc-pr-item-type {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-muted);
        background: var(--surface);
        border: 1px solid var(--border);
        padding: 2px 8px;
        border-radius: 10px;
      }
      .hc-pr-item-title {
        font-size: 0.9rem;
        font-weight: 600;
      }
      .hc-pr-item-desc {
        font-size: 0.82rem;
        color: var(--text-muted);
        line-height: 1.5;
      }
      .hc-pr-delta {
        font-size: 0.75rem;
        margin-top: 6px;
        color: var(--green);
      }
    `;

    const STEPS = ['Candidate', 'Team', 'Org', 'Results'];

    const INITIAL_STATE = {
      candidate: { skills: 50, workStyle: 50, stressResponse: 50, growthPreferences: 50, mobilityGoals: 50 },
      team: { velocity: 50, decisionStyle: 50, feedbackPattern: 50, autonomyTolerance: 50, managerProfile: 50 },
      org: { changeLoad: 50, roleClarity: 50, crossTeamDependency: 50, policyStability: 50, attritionSignals: 50 },
    };

    const PRESET_WEAK_FLOOR = {
      candidate: { skills: 88, workStyle: 75, stressResponse: 70, growthPreferences: 82, mobilityGoals: 65 },
      team: { velocity: 40, decisionStyle: 30, feedbackPattern: 18, autonomyTolerance: 20, managerProfile: 15 },
      org: { changeLoad: 45, roleClarity: 60, crossTeamDependency: 50, policyStability: 55, attritionSignals: 55 },
    };

    const PRESET_STRONG_FLOOR = {
      candidate: { skills: 52, workStyle: 58, stressResponse: 48, growthPreferences: 55, mobilityGoals: 50 },
      team: { velocity: 72, decisionStyle: 80, feedbackPattern: 88, autonomyTolerance: 82, managerProfile: 90 },
      org: { changeLoad: 25, roleClarity: 85, crossTeamDependency: 35, policyStability: 80, attritionSignals: 15 },
    };

    const PRESET_REORG = {
      candidate: { skills: 65, workStyle: 60, stressResponse: 45, growthPreferences: 50, mobilityGoals: 70 },
      team: { velocity: 55, decisionStyle: 35, feedbackPattern: 28, autonomyTolerance: 40, managerProfile: 30 },
      org: { changeLoad: 92, roleClarity: 18, crossTeamDependency: 85, policyStability: 12, attritionSignals: 88 },
    };

    const PRESETS = [
      { key: 'weak_floor', label: 'Great Candidate, Weak Floor', desc: 'Strong hire. Broken team substrate. Watch stability collapse.', data: PRESET_WEAK_FLOOR },
      { key: 'strong_floor', label: 'Average Candidate, Strong Floor', desc: 'Moderate skills. Solid manager. Floor rescues the outcome.', data: PRESET_STRONG_FLOOR },
      { key: 'reorg', label: 'High Conflict Reorg', desc: 'Post-merger chaos. Everything is red. See the intervention list.', data: PRESET_REORG },
    ];

    function HandshakeCopilot() {
      const [step, setStep] = useState('landing');
      const [formStep, setFormStep] = useState(0);
      const [data, setData] = useState(INITIAL_STATE);

      const resetAll = () => { setStep('landing'); setFormStep(0); setData(INITIAL_STATE); };

      return (
        <div className="hc-root">
          <style>{styles}</style>
          <header className="hc-header">
            <div className="hc-logo">Handshake <span>Enterprise Copilot</span></div>
            {step !== 'landing' && (
              <button className="hc-back-link" onClick={resetAll}>← Start Over</button>
            )}
          </header>
          <main className="hc-main">
            {step === 'landing' && (
              <Landing onStart={() => { setStep('form'); setFormStep(0); setData(INITIAL_STATE); }} onPreset={(preset) => { setData(preset); setStep('results'); }} />
            )}
            {step === 'form' && (
              <FormFlow formStep={formStep} setFormStep={setFormStep} data={data} setData={setData} onComplete={() => setStep('results')} />
            )}
            {step === 'results' && (
              <Results data={data} onBack={() => { setStep('form'); setFormStep(2); }} />
            )}
          </main>
        </div>
      );
    }
